<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شاشة العميل</title><style>*{box-sizing:border-box}body{margin:0;background:#071827;color:#fff;font-family:Tahoma,Arial;overflow:hidden}.stage{height:100vh;display:grid;place-items:center;position:relative}.media{display:none;width:100%;height:100%;object-fit:contain}.media.active{display:block}.welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(28px,5vw,72px);font-weight:900;background:linear-gradient(135deg,#0b2942,#071827)}.logo{position:fixed;top:22px;right:28px;z-index:5;max-width:150px;max-height:100px;object-fit:contain;display:none;filter:drop-shadow(0 2px 8px #000)}.ticker{position:fixed;bottom:0;left:0;right:0;height:48px;background:rgba(7,24,39,.9);border-top:2px solid #fbbf24;z-index:6;overflow:hidden;display:none}.ticker span{display:inline-block;white-space:nowrap;padding:12px 100%;animation:marquee 20s linear infinite;font-size:20px;font-weight:800;color:#fff}@keyframes marquee{from{transform:translateX(-100%)}to{transform:translateX(100%)}}.controls{position:fixed;top:18px;left:18px;z-index:10;background:rgba(0,0,0,.75);padding:12px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap}.controls button,.controls input{padding:8px;border-radius:7px;border:1px solid #64748b;background:#fff;color:#111}.hint{position:fixed;bottom:58px;right:15px;opacity:.5;font-size:12px;z-index:7}@media print{.controls,.hint{display:none}}</style></head><body><div class="stage" id="stage"><div class="welcome" id="welcome">أهلاً بكم في عالم الفواكه</div></div><img id="logo" class="logo"><div id="ticker" class="ticker"><span id="tickerText"></span></div><div class="controls"><button onclick="pickMedia()">إضافة صور وفيديو</button><button onclick="pickLogo()">اختيار اللوغو</button><input id="tickerInput" placeholder="نص الشريط الإخباري"><button onclick="saveTicker()">حفظ الشريط</button><button onclick="clearMedia()">مسح الوسائط</button></div><div class="hint">شاشة العميل — الوسائط تحفظ على هذا الجهاز فقط</div><input id="mediaPicker" type="file" accept="image/*,video/*" multiple hidden><input id="logoPicker" type="file" accept="image/*" hidden><script>const DB='customer_display_media_v1';let media=[],idx=0,timer;function openDB(){return new Promise((r,j)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}async function put(k,v){const d=await openDB();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})}async function get(k){const d=await openDB();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})}function pickMedia(){mediaPicker.click()}mediaPicker.onchange=async e=>{media=[];for(const f of e.target.files)media.push({name:f.name,type:f.type,blob:f});await put('media',media);loadMedia()}function pickLogo(){logoPicker.click()}logoPicker.onchange=async e=>{const f=e.target.files[0];if(f){await put('logo',f);showLogo(f)}}function showLogo(f){const l=document.getElementById('logo');l.src=URL.createObjectURL(f);l.style.display='block'}async function loadMedia(){media=await get('media')||[];document.querySelectorAll('.media').forEach(x=>x.remove());media.forEach((m,i)=>{const x=m.type.startsWith('video/')?document.createElement('video'):document.createElement('img');x.className='media';x.src=URL.createObjectURL(m.blob);if(x.tagName==='VIDEO'){x.muted=true;x.loop=true;x.autoplay=true;x.playsInline=true}stage.appendChild(x)});welcome.style.display=media.length?'none':'grid';idx=0;next()}function next(){const a=document.querySelectorAll('.media');if(!a.length)return;a.forEach(x=>x.classList.remove('active'));a[idx%a.length].classList.add('active');if(a[idx%a.length].tagName==='VIDEO')a[idx%a.length].play().catch(()=>{});idx++;clearTimeout(timer);timer=setTimeout(next,5000)}async function pickStored(){const l=await get('logo');if(l)showLogo(l);const t=await get('ticker');if(t){tickerText.textContent=t;ticker.style.display='block';tickerInput.value=t}loadMedia()}function saveTicker(){const t=tickerInput.value.trim();put('ticker',t);tickerText.textContent=t;ticker.style.display=t?'block':'none'}async function clearMedia(){await put('media',[]);media=[];document.querySelectorAll('.media').forEach(x=>x.remove());welcome.style.display='grid'}pickStored()</script></body></html>
